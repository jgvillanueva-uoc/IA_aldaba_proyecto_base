# Runs a repository-local script that creates workflow labels and six project issues.
name: Create Plan Issues

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-plan-issues.yml
      - .github/scripts/create-plan-issues.mjs

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create labels and issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/create-plan-issues.mjs
