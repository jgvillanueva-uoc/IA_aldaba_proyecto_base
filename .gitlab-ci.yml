stages:
  - policy

validate_mr_target:
  stage: policy
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash
  script:
    - |
      set -euo pipefail
      src="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}"
      target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}"

      echo "Source: ${src}"
      echo "Target: ${target}"

      if [[ -z "${src}" || -z "${target}" ]]; then
        echo "Not a merge request pipeline; skipping policy validation."
        exit 0
      fi

      if [[ "${src}" =~ ^(feature|fix|chore|hotfix)/ ]]; then
        if [[ "${target}" != "dev" ]]; then
          echo "Error: issue branches must target 'dev'."
          exit 1
        fi
      fi

      if [[ "${target}" == "main" && "${src}" != "dev" ]]; then
        echo "Error: only 'dev' can target 'main'."
        exit 1
      fi

      echo "MR target policy check passed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
