openapi: 3.0.3
info:
  title: API Gestor de Tareas ICE (MVP)
  version: 1.0.0
  description: >-
    Especificacion funcional minima para CRUD de tareas, asignacion ICE manual,
    estimacion ICE por IA remota, y listado priorizado por ICE.
servers:
  - url: http://localhost:3000
    description: Local

tags:
  - name: Tasks
    description: Operaciones CRUD y listado de tareas
  - name: ICE
    description: Operaciones de estimacion y asignacion ICE

paths:
  /tasks:
    post:
      tags: [Tasks]
      summary: Crear tarea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Tasks]
      summary: Listar tareas
      parameters:
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [ice]
          description: Si es ice, ordena por iceScore descendente
      responses:
        '200':
          description: Lista de tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Obtener detalle de tarea
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Detalle de tarea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [Tasks]
      summary: Actualizar tarea
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Tasks]
      summary: Eliminar tarea
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Tarea eliminada
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tasks/{id}/ice/manual:
    post:
      tags: [ICE]
      summary: Asignar ICE manual a una tarea
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualIceRequest'
      responses:
        '200':
          description: ICE manual aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tasks/{id}/ice/estimate:
    post:
      tags: [ICE]
      summary: Estimar ICE con IA remota usando description
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: ICE estimado y aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/AiUnavailableError'

components:
  parameters:
    TaskId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Identificador unico de la tarea

  responses:
    ValidationError:
      description: Error de validacion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            error: VALIDATION_ERROR
            message: title must be between 3 and 120 characters

    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            error: NOT_FOUND
            message: Task not found

    AiUnavailableError:
      description: Proveedor de IA no disponible o respuesta invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 502
            error: AI_UNAVAILABLE
            message: Timeout or invalid AI payload

  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - description
        - status
        - impact
        - confidence
        - effort
        - iceScore
        - iceSource
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 200
        aiDescription:
          type: string
          maxLength: 200
          nullable: true
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
        dueDate:
          type: string
          format: date-time
          nullable: true
        impact:
          type: integer
          minimum: 1
          maximum: 10
        confidence:
          type: integer
          minimum: 1
          maximum: 10
        effort:
          type: integer
          minimum: 1
          maximum: 10
        iceScore:
          type: integer
          minimum: 0
          maximum: 100
        iceSource:
          type: string
          enum: [manual, ai]
        aiJustification:
          type: string
          maxLength: 200
          nullable: true
        lastAiEstimatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTaskRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
          default: TODO
        dueDate:
          type: string
          format: date-time
          nullable: true

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
        dueDate:
          type: string
          format: date-time
          nullable: true
        impact:
          type: integer
          minimum: 1
          maximum: 10
        confidence:
          type: integer
          minimum: 1
          maximum: 10
        effort:
          type: integer
          minimum: 1
          maximum: 10

    ManualIceRequest:
      type: object
      required: [impact, confidence, effort]
      properties:
        impact:
          type: integer
          minimum: 1
          maximum: 10
        confidence:
          type: integer
          minimum: 1
          maximum: 10
        effort:
          type: integer
          minimum: 1
          maximum: 10
        aiJustification:
          type: string
          maxLength: 200
          nullable: true

    ErrorResponse:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
