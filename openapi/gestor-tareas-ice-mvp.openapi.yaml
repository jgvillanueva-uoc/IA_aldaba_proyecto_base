openapi: 3.0.3
info:
  title: Gestor ICE API
  version: 1.0.0
  description: >-
    OpenAPI manual del MVP de Gestor ICE. Describe CRUD de tareas,
    priorizacion por ICE, asignacion manual de ICE y estimacion por IA.
servers:
  - url: http://localhost:3000
    description: Local

tags:
  - name: App
    description: Endpoint raiz de verificacion
  - name: Tasks
    description: Operaciones CRUD y listado de tareas
  - name: ICE
    description: Operaciones de estimacion y asignacion ICE

paths:
  /:
    get:
      tags: [App]
      summary: Obtener mensaje base de la aplicacion
      responses:
        '200':
          description: Mensaje base
          content:
            application/json:
              schema:
                type: string
              example: Hello World!

  /tasks:
    post:
      tags: [Tasks]
      summary: Crear tarea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              title: Implement priority endpoint
              description: Expose a route to list tasks ordered by ICE score
              status: TODO
      responses:
        '201':
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Tasks]
      summary: Listar tareas
      parameters:
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [ice]
          description: Si es ice, ordena por iceScore descendente
      responses:
        '200':
          description: Lista de tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'

  /tasks/priority:
    get:
      tags: [Tasks]
      summary: Listar tareas ordenadas por prioridad ICE
      parameters:
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Orden de prioridad por iceScore
      responses:
        '200':
          description: Lista de tareas ordenadas por ICE
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Obtener detalle de tarea
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Detalle de tarea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [Tasks]
      summary: Actualizar tarea
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            example:
              status: DONE
              impact: 9
              confidence: 8
              effort: 3
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Tasks]
      summary: Eliminar tarea
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Tarea eliminada
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tasks/{id}/ice/manual:
    post:
      tags: [ICE]
      summary: Asignar ICE manual a una tarea
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualIceRequest'
            example:
              impact: 8
              confidence: 7
              effort: 3
      responses:
        '200':
          description: ICE manual aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tasks/{id}/ice/estimate:
    post:
      tags: [ICE]
      summary: Estimar ICE con IA usando description
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: ICE estimado y aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/AiUnavailableError'

components:
  parameters:
    TaskId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Identificador de la tarea
      example: cm8x123task002

  responses:
    ValidationError:
      description: Error de validacion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            error: VALIDATION_ERROR
            message: order must be one of the following values: asc, desc
            timestamp: '2026-03-17T10:40:00.000Z'
            path: /tasks/priority?order=invalid

    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            error: NOT_FOUND
            message: Task not found
            timestamp: '2026-03-17T10:41:00.000Z'
            path: /tasks/cm8x999missing

    AiUnavailableError:
      description: Proveedor de IA no disponible o respuesta invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 502
            error: AI_UNAVAILABLE
            message: Gemini API key is not configured
            timestamp: '2026-03-17T10:42:00.000Z'
            path: /tasks/cm8x123task002/ice/estimate

  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - description
        - status
        - impact
        - confidence
        - effort
        - iceScore
        - iceSource
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: cm8x123task002
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
        impact:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
        confidence:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
        effort:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
        iceScore:
          type: integer
          nullable: true
          minimum: 1
        iceSource:
          type: string
          nullable: true
          enum: [MANUAL, AI]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTaskRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [TODO, IN_PROGRESS, DONE]
        impact:
          type: integer
          minimum: 1
          maximum: 10
        confidence:
          type: integer
          minimum: 1
          maximum: 10
        effort:
          type: integer
          minimum: 1
          maximum: 10

    ManualIceRequest:
      type: object
      required: [impact, confidence, effort]
      properties:
        impact:
          type: integer
          minimum: 1
          maximum: 10
        confidence:
          type: integer
          minimum: 1
          maximum: 10
        effort:
          type: integer
          minimum: 1
          maximum: 10

    ErrorResponse:
      type: object
      required: [statusCode, error, message, timestamp, path]
      properties:
        statusCode:
          type: integer
        error:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, AI_UNAVAILABLE, INTERNAL_ERROR]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
